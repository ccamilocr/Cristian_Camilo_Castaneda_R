<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cristian Castañeda | Portafolio Interactivo</title>
  <meta name="description" content="Portafolio interactivo de Cristian Castañeda – Especialista en SIG, Bases de Datos y Desarrollo Full-Stack." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ==============================
       DESIGN TOKENS
    ============================== */
    :root {
      --bg:          #f5f5f5;
      --bg-secondary:#ebebeb;
      --fg:          #111111;
      --fg-muted:    #666666;
      --accent:      #1a1a1a;
      --accent-light:#333333;
      --accent-bg:   rgba(0,0,0,.06);
      --card:        #ffffff;
      --border:      #e0e0e0;
      --user-bubble: #1a1a1a;
      --user-text:   #ffffff;
      --bot-bubble:  #ffffff;
      --bot-text:    #111111;
      --shadow:      rgba(0,0,0,.08);
      --glow:        rgba(0,0,0,.10);
      --radius-lg:   16px;
      --radius-md:   12px;
      --radius-sm:   8px;
    }
    [data-theme="dark"] {
      --bg:          #0a0a0a;
      --bg-secondary:#141414;
      --fg:          #e8e8e8;
      --fg-muted:    #888888;
      --accent:      #d4d4d4;
      --accent-light:#ffffff;
      --accent-bg:   rgba(255,255,255,.07);
      --card:        #181818;
      --border:      #2a2a2a;
      --user-bubble: #272727;
      --user-text:   #e8e8e8;
      --bot-bubble:  #181818;
      --bot-text:    #e8e8e8;
      --shadow:      rgba(0,0,0,.40);
      --glow:        rgba(255,255,255,.05);
    }

    /* ==============================
       RESET & BASE
    ============================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      transition: background .3s, color .3s;
    }
    .font-display { font-family: 'Space Grotesk', sans-serif; }

    /* Grid dot pattern */
    .bg-pattern {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0);
      background-size: 28px 28px;
    }

    /* ==============================
       LAYOUT
    ============================== */
    .chat-container {
      position: relative; z-index: 10;
      max-width: 820px; margin: 0 auto;
      height: 100vh;
      display: flex; flex-direction: column;
      padding: 12px;
    }

    /* ==============================
       HEADER
    ============================== */
    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px;
      background: var(--card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: 0 2px 10px var(--shadow);
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-right { display: flex; align-items: center; gap: 8px; }

    .avatar {
      width: 46px; height: 46px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; font-size: 17px; color: #fff;
      flex-shrink: 0;
    }
    .header-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600; font-size: 15px; color: var(--fg);
    }
    .header-sub {
      display: flex; align-items: center; gap: 6px; margin-top: 2px;
    }
    .status-dot {
      width: 8px; height: 8px;
      background: #9ca3af; border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:.65; transform:scale(.9); }
    }
    .status-text { font-size: 12px; color: var(--fg-muted); }

    /* Language switcher */
    .lang-switcher {
      display: flex; gap: 4px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }
    .lang-btn {
      padding: 5px 10px;
      border: none; border-radius: 7px;
      background: transparent;
      color: var(--fg-muted);
      font-size: 11px; font-weight: 600;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: .5px;
      transition: all .2s;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 6px var(--glow);
    }
    .lang-btn:hover:not(.active) { color: var(--accent); }

    /* Theme toggle */
    .theme-toggle {
      width: 44px; height: 26px;
      background: var(--bg-secondary);
      border-radius: 13px;
      border: 1px solid var(--border);
      cursor: pointer; position: relative;
      transition: background .3s;
    }
    .theme-toggle::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      background: var(--accent);
      border-radius: 50%;
      top: 2px; left: 2px;
      transition: transform .3s;
      box-shadow: 0 1px 4px var(--shadow);
    }
    [data-theme="dark"] .theme-toggle::after { transform: translateX(18px); }

    /* ==============================
       CHAT MESSAGES AREA
    ============================== */
    .chat-messages {
      flex: 1; overflow-y: auto;
      padding: 4px 2px 8px;
      display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ==============================
       MESSAGES
    ============================== */
    .message {
      display: flex; gap: 10px;
      opacity: 0; transform: translateY(8px);
      animation: msgIn .28s ease forwards;
    }
    @keyframes msgIn { to { opacity:1; transform:translateY(0); } }
    @keyframes revealItem {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) { .message { animation:none; opacity:1; transform:none; } }
    .message.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 34px; height: 34px;
      border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 12px;
    }
    .bot .msg-avatar {
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: #fff; font-family: 'Space Grotesk', sans-serif;
    }
    .user .msg-avatar { background: var(--bg-secondary); color: var(--fg-muted); }

    .msg-bubble {
      max-width: 78%;
      padding: 13px 17px;
      border-radius: 17px;
      line-height: 1.65; font-size: 14.5px;
    }
    .bot .msg-bubble {
      background: var(--bot-bubble); color: var(--bot-text);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .user .msg-bubble {
      background: var(--user-bubble); color: var(--user-text);
      border-top-right-radius: 4px;
    }

    /* Typing indicator */
    .typing-dots { display: flex; gap: 4px; padding: 6px 2px; }
    .typing-dot {
      width: 7px; height: 7px;
      background: var(--fg-muted); border-radius: 50%;
      animation: bounce 1.3s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: .18s; }
    .typing-dot:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce {
      0%,80%,100% { transform:scale(.8); opacity:.5; }
      40% { transform:scale(1); opacity:1; }
    }

    /* ==============================
       WELCOME CARD
    ============================== */
    .welcome-card {
      text-align: center; padding: 32px 24px 24px;
    }
    .welcome-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px; font-weight: 700;
      margin-bottom: 6px;
    }
    .welcome-title {
      color: var(--accent); font-weight: 500;
      font-size: 14px; margin-bottom: 14px;
    }
    .welcome-photo {
      width: 110px; height: 110px;
      border-radius: 50%;
      object-fit: cover; object-position: center top;
      border: 3px solid var(--accent);
      margin: 0 auto 16px;
      display: block;
    }
    .welcome-summary {
      font-size: 13.5px; color: var(--fg-muted);
      line-height: 1.7; max-width: 560px; margin: 0 auto 18px;
    }

    /* ==============================
       QUICK ACTION BUTTONS
    ============================== */
    .quick-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
    .quick-btn {
      padding: 7px 15px;
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 20px;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all .2s;
    }
    .quick-btn:hover {
      background: var(--accent); color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--glow);
    }
    .quick-btn:active { transform: translateY(0); }
    .quick-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ==============================
       SKILL CARDS
    ============================== */
    .skill-section { margin-bottom: 14px; }
    .skill-section:last-child { margin-bottom: 0; }
    .skill-label {
      font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: .8px;
      color: var(--accent); margin-bottom: 7px;
    }
    .skill-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .skill-tag {
      padding: 4px 11px;
      background: var(--bg-secondary);
      border-radius: 6px; font-size: 12.5px;
      border: 1px solid var(--border);
      color: var(--fg);
    }

    /* ==============================
       EXPERIENCE CARDS
    ============================== */
    .exp-card {
      padding: 14px 15px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .exp-card:last-child { margin-bottom: 0; }
    .exp-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; flex-wrap: wrap; gap: 4px; }
    .exp-role { font-weight: 600; font-family: 'Space Grotesk', sans-serif; font-size: 14px; }
    .exp-period {
      font-size: 11px; color: var(--fg-muted);
      background: var(--card); padding: 2px 8px;
      border-radius: 5px; white-space: nowrap;
    }
    .exp-company { font-size: 13px; color: var(--accent); font-weight: 500; margin-bottom: 6px; }
    .exp-description { font-size: 12px; color: var(--fg-muted); line-height: 1.6; margin-bottom: 10px; font-style: italic; }
    .exp-badge {
      display: inline-block; font-size: 10px;
      background: var(--accent-bg); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 4px;
      padding: 1px 6px; margin-left: 6px; font-weight: 600;
      vertical-align: middle;
    }
    .exp-list { list-style: none; font-size: 13px; color: var(--fg-muted); }
    .exp-list li { padding-left: 14px; margin-bottom: 4px; position: relative; }
    .exp-list li::before {
      content: ''; position: absolute; left: 0; top: 7px;
      width: 5px; height: 5px;
      background: var(--accent); border-radius: 50%;
    }
    .exp-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .exp-link {
      font-size: 12px; color: var(--accent);
      text-decoration: none; font-weight: 500;
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px;
      background: var(--accent-bg);
      border-radius: 5px;
      border: 1px solid var(--accent);
      transition: all .2s;
    }
    .exp-link:hover { background: var(--accent); color: #fff; }

    /* ==============================
       PROJECT CARDS
    ============================== */
    .project-card {
      padding: 15px 16px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .project-card:last-child { margin-bottom: 0; }
    .project-name { font-weight: 600; font-family: 'Space Grotesk', sans-serif; font-size: 14px; margin-bottom: 6px; }
    .project-desc { font-size: 13px; color: var(--fg-muted); margin-bottom: 10px; line-height: 1.6; }
    .project-tech { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .project-tech-tag {
      padding: 2px 9px;
      background: var(--card);
      border-radius: 5px; font-size: 11.5px;
      border: 1px solid var(--border); color: var(--fg-muted);
    }
    .project-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .project-link {
      font-size: 12.5px; color: var(--accent);
      text-decoration: none; font-weight: 500;
      display: inline-flex; align-items: center; gap: 4px;
      transition: color .2s;
    }
    .project-link:hover { color: var(--accent-light); }
    .project-highlights { list-style: none; margin-bottom: 10px; }
    .project-highlights li {
      font-size: 12.5px; color: var(--fg-muted);
      padding-left: 14px; position: relative; margin-bottom: 4px;
    }
    .project-highlights li::before {
      content: '▸'; position: absolute; left: 0;
      color: var(--accent); font-size: 10px; top: 1px;
    }

    /* ==============================
       EDUCATION CARDS
    ============================== */
    .edu-card {
      padding: 13px 15px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .edu-card:last-child { margin-bottom: 0; }
    .edu-degree { font-weight: 600; font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; margin-bottom: 4px; }
    .edu-institution { font-size: 13px; color: var(--accent); font-weight: 500; }
    .edu-meta { font-size: 12px; color: var(--fg-muted); margin-top: 4px; }

    /* ==============================
       CONTACT GRID
    ============================== */
    .contact-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
    .contact-item {
      display: flex; align-items: center; gap: 10px;
      padding: 13px; background: var(--bg-secondary);
      border-radius: var(--radius-md); border: 1px solid var(--border);
      text-decoration: none; color: var(--fg);
      transition: all .2s;
    }
    .contact-item:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow); }
    .contact-icon {
      width: 36px; height: 36px;
      background: var(--accent-bg); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .contact-icon svg { width: 18px; height: 18px; color: var(--accent); }
    .contact-label { font-size: 10px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .5px; }
    .contact-value { font-size: 13px; font-weight: 500; word-break: break-all; }

    /* ==============================
       INPUT AREA
    ============================== */
    .input-area {
      padding: 14px 16px;
      background: var(--card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      margin-top: 12px;
      box-shadow: 0 -2px 16px var(--shadow);
      flex-shrink: 0;
    }
    .input-hint { font-size: 11.5px; color: var(--fg-muted); margin-bottom: 10px; }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    .input-field {
      flex: 1; padding: 12px 16px;
      background: var(--bg); border: 2px solid var(--border);
      border-radius: 13px; font-size: 14.5px; color: var(--fg);
      font-family: 'DM Sans', sans-serif; resize: none;
      min-height: 48px; max-height: 120px;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
    .input-field::placeholder { color: var(--fg-muted); }
    .send-btn {
      width: 48px; height: 48px;
      background: var(--accent); border: none;
      border-radius: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s; flex-shrink: 0;
    }
    .send-btn:hover { background: var(--accent-light); transform: translateY(-2px); box-shadow: 0 5px 14px var(--glow); }
    .send-btn:active { transform: translateY(0); }
    .send-btn svg { width: 20px; height: 20px; color: #fff; }

    /* ==============================
       DIVIDER
    ============================== */
    .section-divider {
      font-size: 11px; color: var(--fg-muted);
      text-align: center; margin: 12px 0 6px;
      letter-spacing: .5px;
    }

    /* ==============================
       RESPONSIVE
    ============================== */
    @media (max-width: 600px) {
      .chat-container { padding: 8px; }
      .chat-header { padding: 10px 12px; }
      .msg-bubble { max-width: 88%; padding: 11px 14px; font-size: 14px; }
      .contact-grid { grid-template-columns: 1fr; }
      .input-area { padding: 10px 12px; }
      .welcome-name { font-size: 22px; }
      .welcome-photo { width: 88px; height: 88px; }
    }
  </style>
</head>
<body>
<div class="bg-pattern"></div>

<div class="chat-container">
  <!-- HEADER -->
  <header class="chat-header">
    <div class="header-left">
      <div class="avatar" id="avatarEl">CC</div>
      <div>
        <div class="header-name font-display">Cristian Castañeda</div>
        <div class="header-sub">
          <div class="status-dot"></div>
          <span class="status-text" id="availableText">Disponible para oportunidades</span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <!-- Language switcher -->
      <div class="lang-switcher" role="group" aria-label="Language selector">
        <button class="lang-btn" id="btn-es" onclick="setLang('es')" aria-pressed="false">ES</button>
        <button class="lang-btn active" id="btn-en" onclick="setLang('en')" aria-pressed="true">EN</button>
        <button class="lang-btn" id="btn-fr" onclick="setLang('fr')" aria-pressed="false">FR</button>
      </div>
      <!-- Theme toggle -->
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark/light mode"></button>
    </div>
  </header>

  <!-- CHAT MESSAGES -->
  <main class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="Chat"></main>

  <!-- INPUT AREA -->
  <footer class="input-area">
    <p class="input-hint" id="inputHint">Pregunta sobre habilidades, experiencia, proyectos, educación...</p>
    <div class="input-row">
      <textarea
        class="input-field"
        id="userInput"
        placeholder="Escribe tu mensaje..."
        rows="1"
        aria-label="Mensaje"
      ></textarea>
      <button class="send-btn" onclick="sendMessage()" aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </footer>
</div>

<script>
/* ==========================================================
   RESUME DATA — loaded from JSON (with embedded fallback)
========================================================== */
let resumeData = null;
let currentLang = 'en';

async function loadData() {
  try {
    const r = await fetch('./data/resume-data.json');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    resumeData = await r.json();
    currentLang = resumeData.meta.defaultLanguage || 'en';
    initUI();
    initChat();
  } catch (_) {
    document.getElementById('chatMessages').innerHTML = `
      <div style="text-align:center;padding:48px 24px;color:var(--fg-muted);line-height:1.8">
        <div style="font-size:32px;margin-bottom:16px">⚠️</div>
        <p style="font-weight:600;font-size:16px;color:var(--fg);margin-bottom:8px">HTTP server required</p>
        <p style="font-size:13px;margin-bottom:20px">Open a terminal inside the <code style="background:var(--bg-secondary);padding:2px 8px;border-radius:5px">portafolio/</code> folder and run one of these:</p>
        <p style="font-size:13px;background:var(--bg-secondary);padding:10px 16px;border-radius:8px;font-family:monospace;margin-bottom:8px">python -m http.server 8000</p>
        <p style="font-size:13px;background:var(--bg-secondary);padding:10px 16px;border-radius:8px;font-family:monospace;margin-bottom:20px">npx http-server</p>
        <p style="font-size:13px">Then open <strong>http://localhost:8000</strong> in your browser.<br>Or use the <strong>Live Server</strong> extension in VS Code.</p>
      </div>`;
  }
}

/* ==========================================================
   LANGUAGE & i18n
========================================================== */
function t() { return resumeData.i18n[currentLang]; }
function tr(field) {
  if (typeof field === 'string') return field;
  return field[currentLang] || field['en'] || Object.values(field)[0] || '';
}

function setLang(lang) {
  if (!resumeData.i18n[lang]) return;
  currentLang = lang;
  // update button states
  ['es','en','fr'].forEach(l => {
    const btn = document.getElementById('btn-'+l);
    if (btn) { btn.classList.toggle('active', l === lang); btn.setAttribute('aria-pressed', l === lang); }
  });
  document.documentElement.lang = lang;
  localStorage.setItem('cc-lang', lang);
  updateStaticUI();
  resetChat();
}

function updateStaticUI() {
  const tx = t();
  document.title = 'Cristian Castañeda | ' + tx.chatTitle;
  const av = document.getElementById('availableText');
  if (av) av.textContent = tx.available;
  const ih = document.getElementById('inputHint');
  if (ih) ih.textContent = tx.inputHint;
  const inp = document.getElementById('userInput');
  if (inp) inp.placeholder = tx.inputPlaceholder;
}

function initUI() {
  const saved = localStorage.getItem('cc-lang');
  if (saved && resumeData.i18n[saved]) {
    currentLang = saved;
    ['es','en','fr'].forEach(l => {
      const btn = document.getElementById('btn-'+l);
      if (btn) { btn.classList.toggle('active', l === currentLang); btn.setAttribute('aria-pressed', l === currentLang); }
    });
    document.documentElement.lang = currentLang;
  }
  updateStaticUI();

  const savedTheme = localStorage.getItem('cc-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', savedTheme || (prefersDark ? 'dark' : 'light'));
}

/* ==========================================================
   CHAT ENGINE
========================================================== */
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const TYPING_DELAY = prefersReducedMotion ? 0 : 700;

function initChat() {
  const container = document.getElementById('chatMessages');
  container.innerHTML = '';
  addMessage(generateWelcome(), false);
  setTimeout(() => {
    addMessage(generateQuickMenu(), false);
  }, prefersReducedMotion ? 0 : 350);
}

function resetChat() {
  updateStaticUI();
  initChat();
}

function addMessage(html, isUser, scrollToTop = false) {
  const tx = t();
  const wrap = document.createElement('div');
  wrap.className = 'message ' + (isUser ? 'user' : 'bot');
  wrap.innerHTML = `
    <div class="msg-avatar">${isUser ? esc(tx.userAvatar) : esc(tx.botAvatar)}</div>
    <div class="msg-bubble">${html}</div>
  `;
  document.getElementById('chatMessages').appendChild(wrap);
  if (scrollToTop) {
    setTimeout(() => wrap.scrollIntoView({ behavior: 'smooth', block: 'start' }), 0);
  } else {
    scrollBottom();
  }
  return wrap;
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'message bot'; wrap.id = 'typing';
  wrap.innerHTML = `
    <div class="msg-avatar">${esc(t().botAvatar)}</div>
    <div class="msg-bubble"><div class="typing-dots">
      <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
    </div></div>
  `;
  document.getElementById('chatMessages').appendChild(wrap);
  scrollBottom();
}
function hideTyping() { const el = document.getElementById('typing'); if (el) el.remove(); }
function scrollBottom() { const c = document.getElementById('chatMessages'); c.scrollTop = c.scrollHeight; }
function scheduleScrolls(count, stepMs) {
  for (let i = 1; i <= count; i++) setTimeout(scrollBottom, i * stepMs);
}

function processMessage(msg) {
  addMessage(esc(msg), true);
  setTimeout(() => showTyping(), prefersReducedMotion ? 0 : 150);
  const intent = detectIntent(msg);
  setTimeout(() => {
    hideTyping();
    const scrollToTop = !prefersReducedMotion && ['experience', 'skills', 'projects'].includes(intent);
    addMessage(buildResponse(intent), false, scrollToTop);
    if (!prefersReducedMotion && intent === 'funfact') {
      const n = (t().responses.funFacts || []).length;
      scheduleScrolls(n + 1, 1000);
    }
  }, TYPING_DELAY);
}

function sendMessage() {
  const inp = document.getElementById('userInput');
  const msg = inp.value.trim();
  if (!msg) return;
  inp.value = ''; inp.style.height = 'auto';
  processMessage(msg);
}

function qa(action) { processMessage(action); }

/* ==========================================================
   INTENT DETECTION (multilingual)
========================================================== */
const KEYWORDS = {
  skills:     ['skill','habilidad','compétence','techn','stack','know','sé','sabe','conoce','lenguaje','language','outil','tool'],
  experience: ['experienc','trabajo','travail','career','carrera','emploi','job','work','histor','trayector','poste','position'],
  projects:   ['project','proyecto','projet','built','construi','créé','develop','portafolio','portfolio','app','aplica'],
  education:  ['educat','formac','formation','degree','título','diplôme','universit','estudi','school','aprendiz'],
  contact:    ['contact','email','linkedin','github','reach','connect','connecter','contac','redes'],
  hire:       ['hire','contratar','recruter','opportunit','oportunid','recruit','disponib','available'],
  funfact:    ['fun','curioso','anecdote','dato','fact','interesting','interesant','intéressant','random'],
  help:       ['help','ayuda','aide','option','menu','can you','qué puedes','que peux'],
  summary:    ['summar','resumen','résumé','overview','quién eres','who are','qui es']
};

function detectIntent(msg) {
  const lower = msg.toLowerCase();
  for (const [intent, kws] of Object.entries(KEYWORDS)) {
    if (kws.some(k => lower.includes(k))) return intent;
  }
  return 'unknown';
}

/* ==========================================================
   RESPONSE BUILDERS
========================================================== */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function generateWelcome() {
  const tx = t();
  const sum = resumeData.summary[currentLang] || '';
  return `
    <div class="welcome-card">
      <div class="welcome-name font-display">${esc(tx.welcomeGreeting)}</div>
      <div class="welcome-title">${esc(tr(resumeData.person.title))}</div>
      <img src="./images/photoface.png" alt="${esc(resumeData.person.name)}" class="welcome-photo">
      <div class="welcome-summary">${esc(sum)}</div>
      <div style="font-size:12px;color:var(--fg-muted)">📍 ${esc(resumeData.person.location)}</div>
    </div>
  `;
}

function generateQuickMenu() {
  const tx = t();
  const qa = tx.quickActions;
  return `
    <p style="margin-bottom:12px;">${esc(tx.welcomeSubtitle)}</p>
    <div class="quick-actions">
      <button class="quick-btn" onclick="qa('${qa.skills}')">${esc(qa.skills)}</button>
      <button class="quick-btn" onclick="qa('${qa.experience}')">${esc(qa.experience)}</button>
      <button class="quick-btn" onclick="qa('${qa.projects}')">${esc(qa.projects)}</button>
      <button class="quick-btn" onclick="qa('${qa.education}')">${esc(qa.education)}</button>
      <button class="quick-btn" onclick="qa('${qa.contact}')">${esc(qa.contact)}</button>
      <button class="quick-btn" onclick="qa('${qa.funfact}')">${esc(qa.funfact)}</button>
    </div>
  `;
}

function buildResponse(intent) {
  switch(intent) {
    case 'skills':     return buildSkills();
    case 'experience': return buildExperience();
    case 'projects':   return buildProjects();
    case 'education':  return buildEducation();
    case 'contact':    return buildContact();
    case 'hire':       return buildHire();
    case 'funfact':    return buildFunFact();
    case 'help':       return buildHelp();
    case 'summary':    return buildSummary();
    default:           return buildUnknown();
  }
}

function backButtons() {
  const tx = t();
  const qa = tx.quickActions;
  return `
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);">
      <p style="font-size:12px;color:var(--fg-muted);margin-bottom:10px;">${esc(tx.welcomeSubtitle)}</p>
      <div class="quick-actions">
        <button class="quick-btn" onclick="qa('${qa.skills}')">${esc(qa.skills)}</button>
        <button class="quick-btn" onclick="qa('${qa.experience}')">${esc(qa.experience)}</button>
        <button class="quick-btn" onclick="qa('${qa.projects}')">${esc(qa.projects)}</button>
        <button class="quick-btn" onclick="qa('${qa.education}')">${esc(qa.education)}</button>
        <button class="quick-btn" onclick="qa('${qa.contact}')">${esc(qa.contact)}</button>
        <button class="quick-btn" onclick="qa('${qa.funfact}')">${esc(qa.funfact)}</button>
      </div>
    </div>
  `;
}

function buildSummary() {
  const sum = resumeData.summary[currentLang] || '';
  return `<p style="line-height:1.75;">${esc(sum)}</p>${backButtons()}`;
}

function buildSkills() {
  const tx = t();
  let html = `<p style="margin-bottom:14px;">${esc(tx.responses.skillsIntro)}</p>`;
  const skills = resumeData.skills || {};
  let i = 0;
  for (const [, cat] of Object.entries(skills)) {
    if (!cat.items || cat.items.length === 0) continue;
    const reveal = `opacity:0;animation:revealItem 0.45s ease forwards;animation-delay:${i * 0.45}s;`;
    html += `
      <div class="skill-section" style="${reveal}">
        <div class="skill-label">${esc(tr(cat.label))}</div>
        <div class="skill-tags">${cat.items.map(s => `<span class="skill-tag">${esc(s)}</span>`).join('')}</div>
      </div>
    `;
    i++;
  }
  html += backButtons();
  return html;
}

function buildExperience() {
  const tx = t();
  let html = `<p style="margin-bottom:14px;">${esc(tx.responses.experienceIntro)}</p>`;
  (resumeData.experience || []).forEach((exp, i) => {
    const achievements = exp.achievements[currentLang] || exp.achievements['en'] || [];
    const links = (exp.links || []).map(l => `<a href="${esc(l.url)}" class="exp-link" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('');
    const reveal = `opacity:0;animation:revealItem 0.45s ease forwards;animation-delay:${i * 0.55}s;`;
    html += `
      <div class="exp-card" style="${reveal}">
        <div class="exp-header">
          <span class="exp-role">${esc(tr(exp.role))}${exp.current ? `<span class="exp-badge">${esc(tx.responses.currentJob)}</span>` : ''}</span>
          <span class="exp-period">${esc(exp.period)}</span>
        </div>
        <div class="exp-company">${esc(exp.company)} · ${esc(exp.location)}</div>
        ${exp.description ? `<div class="exp-description">${esc(tr(exp.description))}</div>` : ''}
        <ul class="exp-list">${achievements.map(a => `<li>${esc(a)}</li>`).join('')}</ul>
        ${links ? `<div class="exp-links">${links}</div>` : ''}
      </div>
    `;
  });
  html += backButtons();
  return html;
}

function buildProjects() {
  const tx = t();
  let html = `<p style="margin-bottom:14px;">${esc(tx.responses.projectsIntro)}</p>`;
  (resumeData.projects || []).forEach((proj, i) => {
    const desc = tr(proj.description);
    const highlights = (proj.highlights[currentLang] || proj.highlights['en'] || []);
    const links = (proj.links || []).map(l =>
      `<a href="${esc(l.url)}" class="project-link" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`
    ).join('');
    const reveal = `opacity:0;animation:revealItem 0.45s ease forwards;animation-delay:${i * 0.55}s;`;
    html += `
      <div class="project-card" style="${reveal}">
        <div class="project-name">${esc(proj.name)}</div>
        <div class="project-desc">${esc(desc)}</div>
        ${highlights.length ? `<ul class="project-highlights">${highlights.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>` : ''}
        <div class="project-tech">${(proj.technologies||[]).map(t=>`<span class="project-tech-tag">${esc(t)}</span>`).join('')}</div>
        ${links ? `<div class="project-links">${links}</div>` : ''}
      </div>
    `;
  });
  html += backButtons();
  return html;
}

function buildEducation() {
  const tx = t();
  let html = `<p style="margin-bottom:14px;">${esc(tx.responses.educationIntro)}</p>`;
  (resumeData.education || []).forEach(edu => {
    html += `
      <div class="edu-card">
        <div class="edu-degree">${esc(tr(edu.degree))}</div>
        <div class="edu-institution">${esc(edu.institution)}</div>
        <div class="edu-meta">${esc(edu.period)} · ${esc(edu.location)}</div>
      </div>
    `;
  });
  html += backButtons();
  return html;
}

function buildContact() {
  const tx = t();
  const c = resumeData.contact || {};
  let html = `<p style="margin-bottom:14px;">${esc(tx.responses.contactIntro)}</p><div class="contact-grid">`;
  if (c.email) html += `
    <a href="mailto:${esc(c.email)}" class="contact-item">
      <div class="contact-icon">${mailIcon()}</div>
      <div><div class="contact-label">Email</div><div class="contact-value">${esc(c.email)}</div></div>
    </a>`;
  if (c.linkedin) html += `
    <a href="${esc(c.linkedin)}" class="contact-item" target="_blank" rel="noopener">
      <div class="contact-icon">${linkedinIcon()}</div>
      <div><div class="contact-label">LinkedIn</div><div class="contact-value">ccamilocr</div></div>
    </a>`;
  if (c.github) html += `
    <a href="${esc(c.github)}" class="contact-item" target="_blank" rel="noopener">
      <div class="contact-icon">${githubIcon()}</div>
      <div><div class="contact-label">GitHub</div><div class="contact-value">ccamilocr</div></div>
    </a>`;
  html += '</div>' + backButtons();
  return html;
}

function buildHire() {
  const tx = t();
  const sum = resumeData.summary[currentLang] || '';
  return `
    <p style="margin-bottom:12px;line-height:1.75;">${esc(tx.responses.hireIntro)}</p>
    <p style="font-size:13px;color:var(--fg-muted);margin-bottom:14px;">${esc(sum)}</p>
    ${backButtons()}`;
}

function buildFunFact() {
  const tx = t();
  const facts = tx.responses.funFacts || [];
  if (!facts.length) return buildUnknown();
  const reveal = 'opacity:0;animation:revealItem 0.45s ease forwards;animation-fill-mode:forwards;';
  let html = facts.map((fact, i) =>
    `<p style="${reveal}animation-delay:${i}s;margin-bottom:12px;font-size:15px;">💡 ${esc(fact)}</p>`
  ).join('');
  html += `<div style="${reveal}animation-delay:${facts.length}s">${backButtons()}</div>`;
  return html;
}

function buildHelp() {
  const tx = t();
  const qa = tx.quickActions;
  return `
    <p style="margin-bottom:12px;">${tx.responses.helpText}</p>
    <div class="quick-actions">
      ${Object.entries(qa).map(([k,v]) => `<button class="quick-btn" onclick="qa('${v}')">${esc(v)}</button>`).join('')}
    </div>`;
}

function buildUnknown() {
  const tx = t();
  const qa = tx.quickActions;
  return `
    <p style="margin-bottom:12px;">${esc(tx.responses.unknownText)}</p>
    <div class="quick-actions">
      <button class="quick-btn" onclick="qa('${qa.skills}')">${esc(qa.skills)}</button>
      <button class="quick-btn" onclick="qa('${qa.experience}')">${esc(qa.experience)}</button>
      <button class="quick-btn" onclick="qa('${qa.projects}')">${esc(qa.projects)}</button>
      <button class="quick-btn" onclick="qa('${qa.contact}')">${esc(qa.contact)}</button>
    </div>`;
}

/* ==========================================================
   SVG ICONS
========================================================== */

  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>

}

/* ==========================================================
   EVENT LISTENERS
========================================================== */
document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('userInput');

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
  });

  loadData();
});

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('cc-theme', next);
}
</script>
